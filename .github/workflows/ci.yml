name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@49f8c1f20b60102eae8c033bb7c7f6cd056f6086 # v2
        with:
          # Keep in step with tree-sitter-cli in package.json. A newer CLI can
          # write a different src/parser.c, which fails the generate check.
          tree-sitter-ref: v0.26.12
      - name: Run tests
        uses: tree-sitter/parser-test-action@05f6ce7c7e54603c45cd87ed926725dc870bcc63 # v3
        with:
          test-rust: true
          test-node: true
          test-python: true
      - name: Parse examples
        uses: tree-sitter/parse-action@f44ffa94f802024f27e821a72e6f2f3efc5dd521 # v4
        with:
          files: examples/*

  package:
    name: Build Python package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install from the sdist
        # A git install never goes through the sdist, so only this step catches
        # a tarball that omits the parser headers or the highlight query.
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --no-binary tree-sitter-mlxtran dist/*.tar.gz
          /tmp/sdist-venv/bin/pip install "tree-sitter~=0.24"
      - name: Test the installed package
        working-directory: /tmp
        run: |
          for suite in tests dist-tests; do
            /tmp/sdist-venv/bin/python -m unittest discover -v \
              -s "$GITHUB_WORKSPACE/bindings/python/$suite" \
              -t "$GITHUB_WORKSPACE/bindings/python/$suite"
          done
